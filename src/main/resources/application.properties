spring.application.name=prioriza
server.address=127.0.0.1
server.port=${PORTA_APLICACAO:8766}
server.max-http-request-header-size=16KB
spring.config.import=optional:file:./configuracao-local.properties
spring.datasource.url=${BANCO_URL:jdbc:postgresql://127.0.0.1:55433/prioriza_demo}
spring.datasource.username=${BANCO_USUARIO:prioriza_demo}
spring.datasource.password=${BANCO_SENHA:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.web.resources.static-locations=file:./publico/
spring.web.resources.cache.cachecontrol.no-store=true
prioriza.pasta-bases=${PASTA_BASES:./Bases}
